<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Summary · Delay Monitor</title>
    <link rel="stylesheet" href="/assets/common.css" />
    <script src="/format.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="/assets/common.js"></script>
  </head>
  <body
    data-page="summary"
    data-title="Summary"
    data-sub="Per-device delay summary across selected time range"
  >
    <main class="content">
      <div class="toolbar">
        <input
          id="q"
          type="search"
          placeholder="Search by name or ID…"
          style="min-width: 240px"
        />
        <button id="load" class="btn-primary">Refresh</button>
        <button id="export" class="btn-primary" disabled>Export Excel</button>
        <span class="spacer"></span>
        <span id="range" class="pill"></span>
        <span id="count" class="pill"></span>
      </div>

      <div id="err" class="card" style="display: none; color: #dc2626"></div>

      <div class="grid kpis" id="kpis"></div>

      <div class="card">
        <h3>Device distribution by average delay category</h3>
        <div class="chart-box"><canvas id="delayPie"></canvas></div>
      </div>

      <div class="card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th class="sortable" data-sort="deviceName">
                  Device <span class="si"></span>
                </th>
                <th class="sortable" data-sort="deviceId">
                  Device ID <span class="si"></span>
                </th>
                <th class="sortable" data-sort="count">
                  Records <span class="si"></span>
                </th>
                <th class="sortable" data-sort="minDelay">
                  Min <span class="si"></span>
                </th>
                <th class="sortable" data-sort="avgDelay">
                  Avg <span class="si"></span>
                </th>
                <th class="sortable" data-sort="maxDelay">
                  Max <span class="si"></span>
                </th>
                <th></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="pager">
          <button id="prev">‹ Previous</button>
          <span id="pageInfo"></span>
          <button id="next">Next ›</button>
        </div>
      </div>
    </main>

    <script>
      const state = {
        all: [],
        totals: null,
        date: "",
        q: "",
        sort: "avgDelay",
        dir: "desc",
        page: 0,
      };

      const NUMERIC_SORT_COLS = ["count", "minDelay", "avgDelay", "maxDelay"];

      const table = createTableController({
        state,
        colSpan: 7,
        emptyMessage: "No matching devices found",
        prepareItems(s) {
          const q = s.q.trim().toLowerCase();
          return s.all.filter(
            (d) =>
              !q ||
              (d.deviceName || "").toLowerCase().includes(q) ||
              String(d.deviceId).toLowerCase().includes(q),
          );
        },
        getSortValue(d, col) {
          return NUMERIC_SORT_COLS.includes(col)
            ? Number(d[col])
            : String(d[col] ?? "").toLowerCase();
        },
        renderRow(d) {
          return `<tr>
            <td>${esc(d.deviceName || "-")}</td>
            <td class="mono">${esc(d.deviceId)}</td>
            <td>${d.count.toLocaleString()}</td>
            <td>${formatDelay(d.minDelay)}</td>
            <td>${formatDelay(d.avgDelay)} ${badge(getCategory(d.avgDelay))}</td>
            <td>${formatDelay(d.maxDelay)} ${badge(getCategory(d.maxDelay))}</td>
            <td><a class="btn-primary" href="${detailHref(d.deviceId, d.deviceName)}">Details</a></td>
          </tr>`;
        },
        onAfterRender() {
          $("#export").disabled = state.all.length === 0;
        },
      });

      function renderKpis() {
        const t = state.totals;
        if (!t) {
          $("#kpis").innerHTML = "";
          return;
        }
        $("#kpis").innerHTML =
          kpi(
            "Displayed devices",
            t.shown.toLocaleString(),
            `${pct(t.shown, t.sentData)}% of reporting devices`,
          ) +
          kpi(
            "Reported ≥ 1x",
            t.sentData.toLocaleString(),
            `out of ${t.registeredDevices.toLocaleString()} registered devices`,
          ) +
          kpi(
            "Excluded: no data",
            t.noData.toLocaleString(),
            "zero records",
          ) +
          kpi(
            "Excluded: min = max = avg = 0",
            t.excludedZero.toLocaleString(),
            "constant 0ms delay",
          ) +
          kpi("Total records", t.records.toLocaleString(), "in selected range");
      }

      function renderPie() {
        const counts = Object.fromEntries(
          DELAY_CATEGORIES.map((c) => [c.key, 0]),
        );
        state.all.forEach((d) => {
          const key = getCategory(d.avgDelay).key;
          counts[key] = (counts[key] || 0) + 1;
        });
        upsertChart(
          "delayPie",
          pieConfig(
            DELAY_CATEGORIES.map((c) => c.key),
            DELAY_CATEGORIES.map((c) => counts[c.key]),
            DELAY_CATEGORIES.map((c) => c.color),
          ),
        );
      }

      function exportXlsx() {
        if (!window.XLSX) {
          alert(
            "Failed to load Excel library. Please check your internet connection and reload the page.",
          );
          return;
        }
        const rows = table.getFilteredAndSorted().map((d) => ({
          Device: d.deviceName || "",
          "Device ID": String(d.deviceId),
          Min: formatDelay(d.minDelay),
          Avg: formatDelay(d.avgDelay),
          Max: formatDelay(d.maxDelay),
        }));

        const ws = XLSX.utils.json_to_sheet(rows, {
          header: ["Device", "Device ID", "Min", "Avg", "Max"],
        });
        ws["!cols"] = [
          { wch: 28 },
          { wch: 24 },
          { wch: 14 },
          { wch: 14 },
          { wch: 14 },
        ];

        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Summary");
        XLSX.writeFile(wb, `summary-delay-${state.date || "data"}.xlsx`);
      }

      document.addEventListener("shell-ready", () => {
        const picker = createTimeRangePicker("#timePicker", {
          defaultKey: "today",
          onChange: () => load(),
        });

        table.bindControls();
        $("#load").addEventListener("click", load);
        $("#export").addEventListener("click", exportXlsx);

        // Fetch on demand without polling because full-range device aggregation can be expensive.
        load();

        async function load() {
          const btn = $("#load");
          const err = $("#err");
          btn.disabled = true;
          err.style.display = "none";
          $("#rows").innerHTML =
            `<tr><td class="empty" colspan="7">Loading… (large time ranges may take a few seconds)</td></tr>`;
          try {
            const win = picker.getWindow();
            const res = await fetch(`/api/summary?${picker.toQueryString()}`);
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

            state.all = data.devices;
            state.totals = data.totals;
            state.date = data.date;
            state.page = 0;
            $("#range").textContent =
              `${formatDateTime(win.fromMs)} – ${formatDateTime(win.toMs)}`;
            renderKpis();
            table.render();
            renderPie();
            setStatus(true);
          } catch (e) {
            state.all = [];
            state.totals = null;
            err.textContent = `Failed to load summary: ${e.message}`;
            err.style.display = "block";
            renderKpis();
            table.render();
            renderPie();
            setStatus(false);
          } finally {
            btn.disabled = false;
          }
        }
      });
    </script>
  </body>
</html>
