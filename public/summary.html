<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daily Summary · VSS Monitoring</title>
    <link rel="stylesheet" href="/assets/common.css" />
    <script src="/format.js"></script>
    <script
      async
      src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"
    ></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"
    ></script>
    <script src="/assets/common.js"></script>
  </head>
  <body
    data-page="summary"
    data-title="Daily Summary"
    data-sub="Midnight snapshot of device staleness and daily delay summary"
  >
    <main class="content">
      <div id="err" class="banner" style="display: none" role="alert"></div>

      <div class="grid kpis" id="kpis"></div>

      <div class="grid even">
        <div class="card">
          <h3>Staleness status distribution (captured at 00:00)</h3>
          <div class="chart-box"><canvas id="stalePie"></canvas></div>
        </div>
        <div class="card">
          <h3>Device distribution by average delay category</h3>
          <div class="chart-box"><canvas id="delayPie"></canvas></div>
        </div>
      </div>

      <div class="card" id="offlineCard" style="margin-bottom: 16px">
        <div class="toolbar">
          <h3 style="margin: 0">Offline devices (captured at 00:00)</h3>
          <span class="spacer"></span>
          <label for="offlineQ" class="sr-only"
            >Search offline device by name or ID</label
          >
          <input
            id="offlineQ"
            class="q"
            type="search"
            placeholder="Search offline device…"
            style="min-width: 220px"
          />
          <button
            id="exportOffline"
            type="button"
            class="btn-primary"
            disabled
          >
            Export Excel
          </button>
          <span class="count pill"></span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th scope="col" class="sortable" data-sort="deviceName">
                  Device <span class="si"></span>
                </th>
                <th scope="col" class="sortable" data-sort="deviceId">
                  Device ID <span class="si"></span>
                </th>
                <th scope="col" class="sortable" data-sort="ageMs">
                  Silent Duration <span class="si"></span>
                </th>
                <th scope="col" class="sortable" data-sort="lastReceived">
                  Last Seen <span class="si"></span>
                </th>
                <th scope="col" class="sortable" data-sort="lastDtu">
                  Last DTU <span class="si"></span>
                </th>
                <th scope="col">Status</th>
                <th scope="col"><span class="sr-only">Actions</span></th>
              </tr>
            </thead>
            <tbody class="rows"></tbody>
          </table>
        </div>
        <div class="pager">
          <label for="offlinePageSize">
            Rows per page
            <select id="offlinePageSize" class="pageSize">
              <option value="50" selected>50</option>
              <option value="100">100</option>
              <option value="200">200</option>
            </select>
          </label>
          <button class="prev" type="button">‹ Previous</button>
          <span class="pageInfo"></span>
          <button class="next" type="button">Next ›</button>
        </div>
      </div>

      <div class="card" id="delayCard">
        <div class="toolbar">
          <h3 style="margin: 0">Delay summary</h3>
          <span class="spacer"></span>
          <label for="delayQ" class="sr-only"
            >Search device in delay summary</label
          >
          <input
            id="delayQ"
            class="q"
            type="search"
            placeholder="Search device…"
            style="min-width: 220px"
          />
          <button id="exportDelay" type="button" class="btn-primary" disabled>
            Export Excel
          </button>
          <span class="count pill"></span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th scope="col" class="sortable" data-sort="deviceName">
                  Device <span class="si"></span>
                </th>
                <th scope="col" class="sortable" data-sort="deviceId">
                  Device ID <span class="si"></span>
                </th>
                <th scope="col" class="sortable" data-sort="count">
                  Records <span class="si"></span>
                </th>
                <th scope="col" class="sortable" data-sort="minDelay">
                  Min <span class="si"></span>
                </th>
                <th scope="col" class="sortable" data-sort="avgDelay">
                  Avg <span class="si"></span>
                </th>
                <th scope="col" class="sortable" data-sort="maxDelay">
                  Max <span class="si"></span>
                </th>
                <th scope="col"><span class="sr-only">Actions</span></th>
              </tr>
            </thead>
            <tbody class="rows"></tbody>
          </table>
        </div>
        <div class="pager">
          <label for="delayPageSize">
            Rows per page
            <select id="delayPageSize" class="pageSize">
              <option value="50" selected>50</option>
              <option value="100">100</option>
              <option value="200">200</option>
            </select>
          </label>
          <button class="prev" type="button">‹ Previous</button>
          <span class="pageInfo"></span>
          <button class="next" type="button">Next ›</button>
        </div>
      </div>
    </main>

    <script>
      document.addEventListener("shell-ready", () => {
        const summaryState = {
          date: "",
          totals: null,
          stalenessCategories: [],
        };

        const offlineState = {
          all: [],
          q: "",
          sort: "ageMs",
          dir: "desc",
          page: 0,
          pageSize: 50,
        };

        const delayState = {
          all: [],
          q: "",
          sort: "avgDelay",
          dir: "desc",
          page: 0,
          pageSize: 50,
        };

        // Shift UTC by +7h so default dates align with the device timezone (WIB).
        const wibDateOffset = (daysOffset = 0) =>
          new Date(Date.now() + (7 + daysOffset * 24) * 3600 * 1000)
            .toISOString()
            .slice(0, 10);

        const offlineBadge = badge(
          STALENESS_CATEGORIES.find((c) => c.key === "OFFLINE") ||
            STALENESS_CATEGORIES[2],
        );

        const offlineTable = createTableController({
          root: "#offlineCard",
          state: offlineState,
          colSpan: 7,
          emptyMessage:
            "No offline devices recorded at midnight for this date, or clear your search filter.",
          prepareItems(s) {
            const q = s.q.trim().toLowerCase();
            return s.all.filter(
              (d) =>
                !q ||
                (d.deviceName || "").toLowerCase().includes(q) ||
                String(d.deviceId).toLowerCase().includes(q),
            );
          },
          getSortValue(d, col) {
            if (col === "ageMs") return Number(d.ageMs);
            if (col === "lastReceived" || col === "lastDtu") {
              return new Date(d[col]).getTime();
            }
            return String(d[col] ?? "").toLowerCase();
          },
          renderRow(d) {
            return `<tr>
              <td>${esc(d.deviceName || "-")}</td>
              <td class="mono">${esc(d.deviceId)}</td>
              <td>${formatStaleness(d.ageMs)}</td>
              <td>${new Date(d.lastReceived).toLocaleString()}</td>
              <td>${d.lastDtu ? new Date(d.lastDtu).toLocaleString() : "-"}</td>
              <td>${offlineBadge}</td>
              <td><a class="btn-primary" href="${detailHref(d.deviceId, d.deviceName)}">Details</a></td>
            </tr>`;
          },
          onAfterRender(list) {
            $("#exportOffline").disabled = list.length === 0;
          },
        });

        const NUMERIC_DELAY_COLS = ["count", "minDelay", "avgDelay", "maxDelay"];

        const delayTable = createTableController({
          root: "#delayCard",
          state: delayState,
          colSpan: 7,
          emptyMessage:
            "No delay records found for this date. Select another date above or clear your search filter.",
          prepareItems(s) {
            const q = s.q.trim().toLowerCase();
            return s.all.filter(
              (d) =>
                !q ||
                (d.deviceName || "").toLowerCase().includes(q) ||
                String(d.deviceId).toLowerCase().includes(q),
            );
          },
          getSortValue(d, col) {
            return NUMERIC_DELAY_COLS.includes(col)
              ? Number(d[col])
              : String(d[col] ?? "").toLowerCase();
          },
          renderRow(d) {
            return `<tr>
              <td>${esc(d.deviceName || "-")}</td>
              <td class="mono">${esc(d.deviceId)}</td>
              <td>${d.count.toLocaleString()}</td>
              <td>${formatDelay(d.minDelay)}</td>
              <td>${formatDelay(d.avgDelay)} ${badge(getCategory(d.avgDelay))}</td>
              <td>${formatDelay(d.maxDelay)} ${badge(getCategory(d.maxDelay))}</td>
              <td><a class="btn-primary" href="${detailHref(d.deviceId, d.deviceName)}">Details</a></td>
            </tr>`;
          },
          onAfterRender(list) {
            $("#exportDelay").disabled = list.length === 0;
          },
        });

        function renderKpis() {
          const t = summaryState.totals;
          if (!t) {
            $("#kpis").innerHTML = "";
            return;
          }
          const offlineCount = t.offlineDevices ?? 0;
          $("#kpis").innerHTML =
            kpi(
              "Total devices",
              t.registeredDevices.toLocaleString(),
              `${(t.onlineDevices ?? 0).toLocaleString()} online · ${(t.warningDevices ?? 0).toLocaleString()} warning`,
              "primary",
            ) +
            kpi(
              "Total offline",
              offlineCount.toLocaleString(),
              `${pct(offlineCount, t.registeredDevices)}% of total · captured at 00:00`,
              offlineCount > 0 ? "err" : "ok",
            ) +
            kpi(
              "Total records",
              t.records.toLocaleString(),
              `${t.shown.toLocaleString()} active devices on ${summaryState.date}`,
              "primary",
            );
        }

        function renderCharts() {
          const staleMap = Object.fromEntries(
            STALENESS_CATEGORIES.map((c) => [c.key, 0]),
          );
          summaryState.stalenessCategories.forEach((c) => {
            staleMap[c.category] = Number(c.count);
          });
          upsertChart(
            "stalePie",
            pieConfig(
              STALENESS_CATEGORIES.map((c) => c.key),
              STALENESS_CATEGORIES.map((c) => staleMap[c.key] || 0),
              STALENESS_CATEGORIES.map((c) => c.color),
              { legendStats: true },
            ),
          );

          const delayCounts = Object.fromEntries(
            DELAY_CATEGORIES.map((c) => [c.key, 0]),
          );
          delayState.all.forEach((d) => {
            const key = getCategory(d.avgDelay).key;
            delayCounts[key] = (delayCounts[key] || 0) + 1;
          });
          upsertChart(
            "delayPie",
            pieConfig(
              DELAY_CATEGORIES.map((c) => c.key),
              DELAY_CATEGORIES.map((c) => delayCounts[c.key]),
              DELAY_CATEGORIES.map((c) => c.color),
              { legendStats: true },
            ),
          );
        }

        function exportOfflineXlsx() {
          if (!window.XLSX) {
            alert(
              "Failed to load Excel library. Please check your internet connection and reload the page.",
            );
            return;
          }
          const rows = offlineTable.getFilteredAndSorted().map((d) => ({
            Device: d.deviceName || "-",
            "Device ID": String(d.deviceId),
            "Silent Duration": formatStaleness(d.ageMs),
            "Last Seen": new Date(d.lastReceived).toLocaleString(),
            "Last DTU": d.lastDtu ? new Date(d.lastDtu).toLocaleString() : "-",
            Status: "OFFLINE",
          }));

          const ws = XLSX.utils.json_to_sheet(rows, {
            header: [
              "Device",
              "Device ID",
              "Silent Duration",
              "Last Seen",
              "Last DTU",
              "Status",
            ],
          });
          ws["!cols"] = [
            { wch: 28 },
            { wch: 24 },
            { wch: 18 },
            { wch: 22 },
            { wch: 22 },
            { wch: 12 },
          ];

          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, "Offline Devices");
          XLSX.writeFile(
            wb,
            `daily-summary-offline-devices_${summaryState.date || "data"}.xlsx`,
          );
        }

        function exportDelayXlsx() {
          if (!window.XLSX) {
            alert(
              "Failed to load Excel library. Please check your internet connection and reload the page.",
            );
            return;
          }
          const rows = delayTable.getFilteredAndSorted().map((d) => ({
            Device: d.deviceName || "-",
            "Device ID": String(d.deviceId),
            Records: d.count,
            Min: formatDelay(d.minDelay),
            Avg: `${formatDelay(d.avgDelay)} (${getCategory(d.avgDelay).key})`,
            Max: `${formatDelay(d.maxDelay)} (${getCategory(d.maxDelay).key})`,
          }));

          const ws = XLSX.utils.json_to_sheet(rows, {
            header: ["Device", "Device ID", "Records", "Min", "Avg", "Max"],
          });
          ws["!cols"] = [
            { wch: 28 },
            { wch: 24 },
            { wch: 12 },
            { wch: 14 },
            { wch: 18 },
            { wch: 18 },
          ];

          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, "Delay Summary");
          XLSX.writeFile(
            wb,
            `daily-summary-delay_${summaryState.date || "data"}.xlsx`,
          );
        }

        const pickerSlot = $("#timePicker");
        pickerSlot.innerHTML = `
          <div style="display:inline-flex;align-items:center;gap:6px">
            <label for="date" class="sr-only">Summary date</label>
            <input id="date" type="date" aria-label="Summary date" />
            <button id="cancelLoad" type="button" class="trp-cancel" style="display:none">✕ Cancel</button>
          </div>
        `;

        const dateEl = $("#date");
        const cancelBtn = $("#cancelLoad");
        dateEl.value = wibDateOffset(-1);
        dateEl.max = wibDateOffset(0);

        offlineTable.bindControls();
        delayTable.bindControls();

        $("#exportOffline").addEventListener("click", exportOfflineXlsx);
        $("#exportDelay").addEventListener("click", exportDelayXlsx);

        let activeController = null;
        let previousDate = dateEl.value;

        cancelBtn.addEventListener("click", () => {
          if (activeController) {
            dateEl.value = previousDate;
            activeController.abort();
          }
        });

        dateEl.addEventListener("change", () => load());

        load();

        async function load() {
          if (activeController) activeController.abort();
          const controller = new AbortController();
          activeController = controller;

          const err = $("#err");
          err.style.display = "none";
          dateEl.disabled = true;
          cancelBtn.style.display = "inline-flex";

          try {
            const data = await api(
              `/api/summary?date=${encodeURIComponent(dateEl.value)}`,
              { signal: controller.signal },
            );
            if (activeController !== controller) return;

            previousDate = data.date;
            summaryState.date = data.date;
            summaryState.totals = data.totals;
            summaryState.stalenessCategories = data.stalenessCategories || [];
            offlineState.all = data.offlineDevices || [];
            offlineState.page = 0;
            delayState.all = data.devices || [];
            delayState.page = 0;

            renderKpis();
            renderCharts();
            offlineTable.render();
            delayTable.render();
            setStatus(true);
          } catch (e) {
            if (controller.signal.aborted || e?.name === "AbortError") {
              if (activeController === controller) {
                setStatus(true, "Query cancelled");
              }
              return;
            }
            summaryState.totals = null;
            summaryState.stalenessCategories = [];
            offlineState.all = [];
            delayState.all = [];
            err.innerHTML = `<div style="flex:1"><strong>Failed to load daily summary</strong>${esc(e.message)}. Select another date or try again.</div><button type="button" class="btn-primary" id="retrySummaryBtn">Retry now</button>`;
            err.style.display = "flex";
            const retryBtn = $("#retrySummaryBtn", err);
            if (retryBtn) retryBtn.addEventListener("click", () => load());
            renderKpis();
            renderCharts();
            offlineTable.render();
            delayTable.render();
            setStatus(false);
          } finally {
            if (activeController === controller) {
              activeController = null;
              dateEl.disabled = false;
              cancelBtn.style.display = "none";
            }
          }
        }
      });
    </script>
  </body>
</html>
