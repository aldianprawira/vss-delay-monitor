<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Devices · Delay Monitor</title>
    <link rel="stylesheet" href="/assets/common.css" />
    <script src="/format.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script src="/assets/common.js"></script>
  </head>
  <body
    data-page="devices"
    data-title="Devices"
    data-sub="Latest telemetry status for each device"
  >
    <main class="content">
      <div class="toolbar">
        <input
          id="q"
          type="search"
          placeholder="Search by name or ID…"
          style="min-width: 240px"
        />
        <select id="fDelay">
          <option value="">All delay categories</option>
        </select>
        <select id="fStale">
          <option value="">All statuses</option>
        </select>
        <button id="export" class="btn-primary" disabled>Export Excel</button>
        <span class="spacer"></span>
        <span id="count" class="pill"></span>
      </div>

      <div class="card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th class="sortable" data-sort="device_name">
                  Device <span class="si"></span>
                </th>
                <th class="sortable" data-sort="device_id">
                  Device ID <span class="si"></span>
                </th>
                <th class="sortable" data-sort="delay_ms">
                  Delay <span class="si"></span>
                </th>
                <th class="sortable" data-sort="last_received">
                  Last Seen <span class="si"></span>
                </th>
                <th class="sortable" data-sort="last_dtu">
                  Last DTU <span class="si"></span>
                </th>
                <th></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="pager">
          <button id="prev">‹ Previous</button>
          <span id="pageInfo"></span>
          <button id="next">Next ›</button>
        </div>
      </div>
    </main>

    <script>
      const state = {
        all: [],
        q: "",
        delay: "",
        stale: "",
        sort: "delay_ms",
        dir: "desc",
        page: 0,
      };

      const table = createTableController({
        state,
        colSpan: 6,
        emptyMessage: "No matching devices found",
        prepareItems(s) {
          const now = Date.now();
          const q = s.q.trim().toLowerCase();
          return s.all
            .map((d) => {
              const age = now - new Date(d.last_received).getTime();
              return {
                ...d,
                age,
                delayCat: getCategory(d.delay_ms),
                staleCat: getStalenessCategory(age),
              };
            })
            .filter(
              (d) =>
                (!q ||
                  (d.device_name || "").toLowerCase().includes(q) ||
                  String(d.device_id).toLowerCase().includes(q)) &&
                (!s.delay || d.delayCat.key === s.delay) &&
                (!s.stale || d.staleCat.key === s.stale),
            );
        },
        getSortValue(d, col) {
          if (col === "delay_ms") return Number(d[col]);
          if (col === "last_received" || col === "last_dtu") {
            return new Date(d[col]).getTime();
          }
          return String(d[col] ?? "").toLowerCase();
        },
        renderRow(d) {
          return `<tr>
            <td>${esc(d.device_name || "-")}</td>
            <td class="mono">${esc(d.device_id)}</td>
            <td>${formatDelay(d.delay_ms)} ${badge(d.delayCat)}</td>
            <td>${formatStaleness(d.age)} ${badge(d.staleCat)}</td>
            <td>${new Date(d.last_dtu).toLocaleString()}</td>
            <td><a class="btn-primary" href="${detailHref(d.device_id, d.device_name)}">Details</a></td>
          </tr>`;
        },
        onAfterRender(list) {
          $("#export").disabled = list.length === 0;
        },
      });

      function sanitizeFilenameToken(value) {
        return String(value)
          .replace(/^>/, "gt-")
          .replace(/^</, "lt-")
          .replace(/[^a-zA-Z0-9_-]+/g, "-")
          .replace(/^-+|-+$/g, "");
      }

      function buildExportFilename() {
        const parts = ["devices"];
        if (state.q.trim()) {
          parts.push(`search-${sanitizeFilenameToken(state.q.trim())}`);
        }
        parts.push(
          `delay-${state.delay ? sanitizeFilenameToken(state.delay) : "all"}`,
        );
        parts.push(
          `status-${state.stale ? sanitizeFilenameToken(state.stale) : "all"}`,
        );
        const timestamp = formatDateTime(Date.now())
          .replace(" ", "_")
          .replace(/:/g, "-");
        parts.push(timestamp);
        return `${parts.join("_")}.xlsx`;
      }

      function exportXlsx() {
        if (!window.XLSX) {
          alert(
            "Failed to load Excel library. Please check your internet connection and reload the page.",
          );
          return;
        }
        const rows = table.getFilteredAndSorted().map((d) => ({
          Device: d.device_name || "-",
          "Device ID": String(d.device_id),
          Delay: `${formatDelay(d.delay_ms)} (${d.delayCat.key})`,
          "Last Seen": `${formatStaleness(d.age)} (${d.staleCat.key})`,
          "Last DTU": new Date(d.last_dtu).toLocaleString(),
        }));

        const ws = XLSX.utils.json_to_sheet(rows, {
          header: ["Device", "Device ID", "Delay", "Last Seen", "Last DTU"],
        });
        ws["!cols"] = [
          { wch: 28 },
          { wch: 24 },
          { wch: 20 },
          { wch: 24 },
          { wch: 22 },
        ];

        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Devices");
        XLSX.writeFile(wb, buildExportFilename());
      }

      document.addEventListener("shell-ready", () => {
        DELAY_CATEGORIES.forEach((c) =>
          $("#fDelay").insertAdjacentHTML(
            "beforeend",
            `<option value="${esc(c.key)}">${esc(c.key)}</option>`,
          ),
        );
        STALENESS_CATEGORIES.forEach((c) =>
          $("#fStale").insertAdjacentHTML(
            "beforeend",
            `<option value="${esc(c.key)}">${esc(c.key)}</option>`,
          ),
        );

        table.bindControls();
        $("#export").addEventListener("click", exportXlsx);

        $("#fDelay").addEventListener("change", (e) => {
          state.delay = e.target.value;
          state.page = 0;
          table.render();
        });
        $("#fStale").addEventListener("change", (e) => {
          state.stale = e.target.value;
          state.page = 0;
          table.render();
        });

        poll(async () => {
          state.all = await api("/api/devices");
          table.render();
        }, 5000);
      });
    </script>
  </body>
</html>
