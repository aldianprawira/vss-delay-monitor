<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Delay · Delay Monitor</title>
    <link rel="stylesheet" href="/assets/common.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="/format.js"></script>
    <script src="/assets/common.js"></script>
  </head>
  <body
    data-page="delay"
    data-title="Delay"
    data-sub="Time difference between device timestamp (dtu) and server receipt"
  >
    <main class="content">
      <div class="grid kpis" id="kpis"></div>

      <div class="grid two">
        <div class="card">
          <h3>Current distribution</h3>
          <div class="chart-box"><canvas id="pie"></canvas></div>
        </div>
        <div class="card">
          <h3>Delay trend</h3>
          <div class="chart-box"><canvas id="trend"></canvas></div>
        </div>
      </div>

      <div class="card">
        <h3>Top 5 highest delays in selected range</h3>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Device</th>
                <th>Device ID</th>
                <th>Max Delay</th>
                <th>Category</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="offenders"></tbody>
          </table>
        </div>
      </div>
    </main>

    <script>
      document.addEventListener("shell-ready", () => {
        let refresh;
        const picker = createTimeRangePicker("#timePicker", {
          defaultKey: "1h",
          onChange: () => refresh && refresh(),
        });

        refresh = poll(async () => {
          const qs = picker.toQueryString();
          const win = picker.getWindow();
          const [summary, timeline] = await Promise.all([
            api(`/api/stats/summary?${qs}`),
            api(`/api/stats/timeline?${qs}`),
          ]);

          const cw = summary.currentWorst;
          const hw = summary.historicalWorst;
          const over5s = countDelayedDevices(summary.categories);
          $("#kpis").innerHTML =
            kpi("Total devices", summary.totalDevices.toLocaleString()) +
            kpi(
              "Current highest delay",
              cw ? formatDelay(cw.delay_ms) : "-",
              cw ? deviceName(cw) : "",
            ) +
            kpi(
              `Highest delay (${win.shortLabel})`,
              hw ? formatDelay(hw.delay_ms) : "-",
              hw ? deviceName(hw) : "",
            ) +
            kpi(
              "Devices > 5s",
              over5s.toLocaleString(),
              `${pct(over5s, summary.totalDevices)}% of total`,
            );

          upsertChart("pie", categoryPieConfig(summary.categories));
          upsertChart("trend", delayTrendConfig(timeline));

          $("#offenders").innerHTML =
            summary.topOffenders
              .map(
                (o, i) => `<tr>
                <td>${i + 1}</td>
                <td>${esc(o.device_name || "-")}</td>
                <td class="mono">${esc(o.device_id)}</td>
                <td>${formatDelay(o.max_delay)}</td>
                <td>${badge(getCategory(o.max_delay))}</td>
                <td><a class="btn-primary" href="${detailHref(o.device_id, o.device_name)}">Details</a></td>
              </tr>`,
              )
              .join("") ||
            `<tr><td class="empty" colspan="6">No data available</td></tr>`;
        }, 5000);
      });
    </script>
  </body>
</html>
